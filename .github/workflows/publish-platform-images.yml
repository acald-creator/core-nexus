# Publish Console, API gateway, and AI inference images to Docker Hub; sign with Cosign.
#
# Secrets: DOCKER_USERNAME, DOCKER_PASSWORD, COSIGN_PRIVATE_KEY, COSIGN_PASSWORD (empty OK)
# Triggers: workflow_dispatch (tag input) or push tags matching v*
name: Publish platform images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (semver preferred, e.g. v0.1.1)
        required: true
        default: v0.1.1
  push:
    tags:
      - "v*"

env:
  REGISTRY_NS: phoenixvlabs

jobs:
  publish:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: nexus-console
            context: platform/nexus-console
            dockerfile: platform/nexus-console/Dockerfile
            build_args: |
              VITE_API_GATEWAY_URL=http://nexus-api-gateway.soc.svc.cluster.local:3100
              VITE_DEV_AUTH_BYPASS=false
          - name: nexus-api-gateway
            context: platform/api-gateway
            dockerfile: platform/api-gateway/Dockerfile
            build_args: ""
          - name: nexus-ai-inference
            context: platform/ai-inference
            dockerfile: platform/ai-inference/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_NS }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_NS }}/${{ matrix.name }}:latest
          build-args: ${{ matrix.build_args }}

      # nebucloud/ssf is private — CI cannot `go install` it without a read token.
      # Cosign is what ssf shells out to for OCI sign; use it directly until SSF is
      # public or NEBUCLOUD_READ_TOKEN is wired for `go install` / checkout.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --yes --key cosign.key \
            "${{ env.REGISTRY_NS }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}"
          rm -f cosign.key
