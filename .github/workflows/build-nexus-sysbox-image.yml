name: Build Sysbox Nexus Image

on:
  push:
    branches:
      - main

env:
  TAG: latest

jobs:
  build-and-sign:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/docker/Dockerfile.sysbox.image
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:latest-sysbox
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:${{ github.sha }}-sysbox

      - name: Sign image with cosign
        shell: bash
        run: |
          cosign sign --yes -a commit=${{ github.sha }} \
            -a "repo=${{ secrets.DOCKER_USERNAME }}/core-nexus" \
            -a "workflow=${{ github.workflow }}" \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:latest-sysbox && \
          cosign sign --yes -a commit=${{ github.sha }} \
            -a "repo=${{ secrets.DOCKER_USERNAME }}/core-nexus" \
            -a "workflow=${{ github.workflow }}" \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:${{ github.sha }}-sysbox
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
