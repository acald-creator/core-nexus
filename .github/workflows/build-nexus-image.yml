# Legacy monorepo image (images/docker/Dockerfile) for Docker Hub phoenixvlabs/core-nexus.
# SOC Console / gateway / ai-inference publish via publish-platform-images.yml instead.
name: Build Default Nexus Image

on:
  push:
    branches:
      - main
    paths:
      - "images/docker/Dockerfile"
      - "images/docker/**"
      - ".github/workflows/build-nexus-image.yml"
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:latest
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:${{ github.sha }}

      - name: Sign image with cosign
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_NS: ${{ secrets.DOCKER_USERNAME }}
        run: |
          cosign sign --yes -a commit=${{ github.sha }} \
            -a "repo=${IMAGE_NS}/core-nexus" \
            -a "workflow=${{ github.workflow }}" \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_NS}/core-nexus:latest"
          cosign sign --yes -a commit=${{ github.sha }} \
            -a "repo=${IMAGE_NS}/core-nexus" \
            -a "workflow=${{ github.workflow }}" \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_NS}/core-nexus:${{ github.sha }}"
