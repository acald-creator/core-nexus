name: Build Default Nexus Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        type: string
      secrets:
        registry_username:
          required: true
        registry_password:
          required: true
  push:
    branches:
      - main

env:
  REGISTRY_DOCKERIO_PASS: ${{ secrets.REGISTRY_DOCKERIO_PASS }}
  REGISTRY_DOCKERIO_USER: ${{ secrets.REGISTRY_DOCKERIO_USER }}
  TAG: latest

jobs:
  dagger:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      # Install Golang and check version
      - name: Install go
        uses: actions/setup-go@v3
        with:
          go-version: 1.19.4
          check-latest: true

      # Install cosign and check version
      - name: Install cosign
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: main
      - name: Check cosign installation
        run: cosign version

      # Use Docker to login to Dockerhub
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and push Docker image
      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: images/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:latest
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:${{ github.sha }}

      # Sign image with cosign
      - name: Sign image
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          cosign sign --yes -a commit=${{ github.sha }} \
            -a "repo=${{ secrets.DOCKER_USERNAME }}/core-nexus" \
            -a "workflow=${{ github.workflow }}" \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:$VERSION && \
          cosign sign --yes -a commit=${{ github.sha }} \
            -a "repo=${{ secrets.DOCKER_USERNAME }}/core-nexus" \
            -a "workflow=${{ github.workflow }}" \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ secrets.DOCKER_USERNAME }}/core-nexus:${{ env.TAG }}
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}
