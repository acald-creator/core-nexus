# First GitOps workload: Console + API gateway on Cloudflare R2.
# MinIO lab overlay remains at overlays/gitops-lab for local/compose use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-gitops-lab
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: underground-nexus
    nexus.underground.io/plane: fabric
spec:
  project: default
  source:
    # bootstrap.sh does not rewrite this file; align with NEXUS_GIT_URL or edit after apply.
    repoURL: https://github.com/acald-creator/core-nexus.git
    targetRevision: main
    path: deploy/kubernetes/soc/overlays/r2
  destination:
    server: https://kubernetes.default.svc
    namespace: soc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Owned by sync-vault-to-k8s.sh (secret/nexus/prod)
    - kind: Secret
      name: nexus-gateway-secrets
      jsonPointers:
        - /data
        - /stringData
