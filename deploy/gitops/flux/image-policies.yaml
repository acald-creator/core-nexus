# Semver policy: prefer tagged releases when SSF starts publishing them.
# Until then, "latest" metadata may not advance usefully — pin digests after OCI+SSF.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-console
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-console
  policy:
    semver:
      range: ">=0.1.0"
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-api-gateway
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-api-gateway
  policy:
    semver:
      range: ">=0.1.0"
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
    extract: '$version'
