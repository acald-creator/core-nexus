# Semver policy: prefer tagged releases when SSF starts publishing them.
# Until then, "latest" metadata may not advance usefully — pin digests after OCI+SSF.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-console
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-console
  policy:
    semver:
      range: ">=0.1.0"
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-api-gateway
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-api-gateway
  policy:
    semver:
      range: ">=0.1.0"
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-workbench
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-workbench
  policy:
    semver:
      range: ">=0.1.0"
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
    extract: '$version'
---
# nexus-athena Hub tags are often git SHAs (e.g. dc1aa25); alphabetical is fine for lab.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-athena
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-athena
  policy:
    alphabetical:
      order: asc
  filterTags:
    pattern: '^(?P<tag>[a-z0-9][a-z0-9._-]{2,127})$'
    extract: '$tag'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nexus-ai-inference
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nexus-ai-inference
  policy:
    semver:
      range: ">=0.1.0"
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
    extract: '$version'
