# Flux watches published nexus images. Point image to your registry if different.
# Private registries need an imagePullSecret referenced on ImageRepository.spec.secretRef.
# For localhost:5001 lab registries see image-repositories-local.example.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: nexus-console
  namespace: flux-system
spec:
  image: phoenixvlabs/nexus-console
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: nexus-api-gateway
  namespace: flux-system
spec:
  image: phoenixvlabs/nexus-api-gateway
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: nexus-workbench
  namespace: flux-system
spec:
  image: phoenixvlabs/nexus-workbench
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: nexus-athena
  namespace: flux-system
spec:
  image: phoenixvlabs/nexus-athena
  interval: 5m
