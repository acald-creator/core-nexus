# EXAMPLE ONLY — copy, fill, apply. Never commit real tokens.
#
#   kubectl -n flux-system create secret generic flux-git-auth \
#     --from-literal=username=git \
#     --from-literal=password=YOUR_GITHUB_PAT
#
# PAT needs repo contents:write for image automation pushes.
apiVersion: v1
kind: Secret
metadata:
  name: flux-git-auth
  namespace: flux-system
type: Opaque
stringData:
  username: git
  password: REPLACE_WITH_GITHUB_PAT_OR_DEPLOY_KEY_TOKEN
