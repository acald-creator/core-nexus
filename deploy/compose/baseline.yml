version: "3.8"

services:
  nexus-console:
    container_name: nexus-console
    build:
      context: ../../platform/nexus-console
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    restart: always
    networks:
      Inner-Athena:

  nginx-proxy:
    container_name: nginx-proxy
    image: nginxproxy/nginx-proxy
    ports:
      - "80:80"
    environment:
      DEFAULT_HOST: pi.hole.home.lan
    volumes:
      - "/var/run/docker.sock:/tmp/docker.sock"
    restart: always
    networks:
      Inner-Athena:

  pihole:
    image: pihole/pihole:latest
    container_name: Inner-DNS-Control
    hostname: Inner-DNS-Control
    ports:
      - "8081:80/tcp"
    volumes:
      - "pihole_dns_data:/etc/dnsmasq.d"
      - "/var/lib/docker/volumes/pihole_dns_data/_data/pihole/:/etc/pihole/"
    environment:
      ServerIP: 10.20.0.20
      PROXY_LOCATION: pihole
      VIRTUAL_HOST: pi.hole.home.lan
      VIRTUAL_PORT: 80
    restart: always
    networks:
      Inner-Athena:
        ipv4_address: 10.20.0.20

  portainer:
    container_name: Olympiad0
    image: portainer/portainer-ce:2.14.0
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - portainer_data:/data
    command: --admin-password '$$2y$$05$$R33u1OSAOCFiaKQN5Vt50O8LsVGA6wbsW0tj4mdLy2Cow9bUCuNgK'
    networks:
      Inner-Athena:
    dns:
      - 10.20.0.20
    restart: always

networks:
  Inner-Athena:
    name: Inner-Athena
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24

volumes:
  pihole_dns_data:
  portainer_data:
