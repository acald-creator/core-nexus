# Unified dev compose stack for Underground Nexus
# Starts: API Gateway + MinIO + AI Inference + Nexus Console
#
# Usage:
#   docker compose -f deploy/compose/dev.yml up -d
#   docker compose -f deploy/compose/dev.yml logs -f api-gateway
#   docker compose -f deploy/compose/dev.yml down
#
# Console: http://localhost:3000
# API Gateway: http://localhost:3100 (docs at /docs in debug mode)
# MinIO Console: http://localhost:9001 (minioadmin/minioadmin)
# AI Inference: http://localhost:8000 (docs at /docs)

services:
  # ─── Nexus Console (React SPA) ────────────────────────────────────────
  nexus-console:
    container_name: nexus-console
    build:
      context: ../../platform/nexus-console
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - nexus-dev

  # ─── API Gateway (FastAPI) ────────────────────────────────────────────
  api-gateway:
    container_name: nexus-api-gateway
    build:
      context: ../../platform/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      NEXUS_GW_JWT_SECRET: ${NEXUS_GW_JWT_SECRET:-dev-secret-do-not-use-in-production}
      NEXUS_GW_WAZUH_API_URL: ${NEXUS_GW_WAZUH_API_URL:-https://wazuh-manager:55000}
      NEXUS_GW_WAZUH_API_USER: ${NEXUS_GW_WAZUH_API_USER:-wazuh-wui}
      NEXUS_GW_WAZUH_API_PASSWORD: ${NEXUS_GW_WAZUH_API_PASSWORD:-changeme}
      NEXUS_GW_AI_INFERENCE_URL: http://ai-inference:8000
      NEXUS_GW_ATHENA_AGENTS_URL: ${NEXUS_GW_ATHENA_AGENTS_URL:-http://host.docker.internal:8080}
      NEXUS_GW_MINIO_ENDPOINT: minio:9000
      NEXUS_GW_MINIO_PUBLIC_ENDPOINT: localhost:9000
      NEXUS_GW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      NEXUS_GW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      NEXUS_GW_MINIO_BUCKET: nexus-memory
      NEXUS_GW_CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      NEXUS_GW_DEBUG: "true"
      NEXUS_GW_SERVICE_REGISTRY_PATH: /app/config/services.json
      NEXUS_GW_LOG_LEVEL: info
    depends_on:
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nexus-dev

  # ─── MinIO (Object Storage) ──────────────────────────────────────────
  minio:
    container_name: nexus-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:5173"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus-dev

  # ─── MinIO Bootstrap (create buckets on first run) ───────────────────
  minio-init:
    container_name: nexus-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: |
      -c "
      mc alias set nexus http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing nexus/nexus-memory &&
      mc mb --ignore-existing nexus/nexus-memory/skills &&
      mc mb --ignore-existing nexus/nexus-memory/sessions &&
      mc mb --ignore-existing nexus/nexus-memory/pcaps &&
      mc mb --ignore-existing nexus/nexus-memory/sboms &&
      echo 'MinIO buckets initialized'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - nexus-dev

  # ─── AI Inference (FastAPI triage service) ───────────────────────────
  ai-inference:
    container_name: nexus-ai-inference
    build:
      context: ../../platform/ai-inference
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - nexus-dev

networks:
  nexus-dev:
    name: nexus-dev
    driver: bridge

volumes:
  minio_data:
    driver: local
