# Lab defaults for API Gateway. Overwrite JWT/MinIO/Wazuh from Vault:
#   ./deploy/scripts/sync-vault-to-k8s.sh
apiVersion: v1
kind: Secret
metadata:
  name: nexus-gateway-secrets
  namespace: soc
  labels:
    app.kubernetes.io/part-of: underground-nexus
    app.kubernetes.io/component: api-gateway
type: Opaque
stringData:
  NEXUS_GW_JWT_SECRET: dev-secret-do-not-use-in-production
  NEXUS_GW_MINIO_ACCESS_KEY: minioadmin
  NEXUS_GW_MINIO_SECRET_KEY: minioadmin
  NEXUS_GW_WAZUH_API_PASSWORD: changeme
  # Optional AppRole (leave empty until synced from hashistack export)
  NEXUS_GW_VAULT_ROLE_ID: ""
  NEXUS_GW_VAULT_SECRET_ID: ""
