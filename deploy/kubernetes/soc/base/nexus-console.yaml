apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-console
  namespace: soc
  labels:
    app: nexus-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-console
  template:
    metadata:
      labels:
        app: nexus-console
    spec:
      containers:
        - name: console
          image: phoenixvlabs/nexus-console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-console
  namespace: soc
  labels:
    app: nexus-console
spec:
  selector:
    app: nexus-console
  ports:
    - name: http
      port: 80
      targetPort: 8080
# Browser login targets the gateway Service; bake VITE_API_GATEWAY_URL at image
# build time (compose/lab) or put a reverse-proxy in front for cluster ingress.
