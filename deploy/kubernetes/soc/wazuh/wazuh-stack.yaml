# Minimal Wazuh manager + OpenSearch indexer for SOC labs.
# Credentials come from Secret wazuh-secrets (synced from Vault via
# deploy/scripts/sync-vault-to-k8s.sh or the placeholder in wazuh-secrets.yaml).
#
# Indexer security plugin stays disabled here (HTTP). Enabling it needs TLS
# certs and is a follow-up; passwords are still wired for manager API / future use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-indexer
  labels:
    app.kubernetes.io/name: wazuh-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-indexer
    spec:
      containers:
        - name: wazuh-indexer
          image: opensearchproject/opensearch:2.13.0
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            # LAB ONLY — HTTP single-node. Do not enable for staging/prod without TLS.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            # Reserved for when security plugin is enabled; harmless while disabled.
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          ports:
            - containerPort: 9200
              name: api
            - containerPort: 9600
              name: perf
          readinessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: api
  selector:
    app.kubernetes.io/name: wazuh-indexer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-manager
  labels:
    app.kubernetes.io/name: wazuh-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-manager
    spec:
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.8.0
          env:
            - name: INDEXER_URL
              value: http://wazuh-indexer:9200
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: INDEXER_USERNAME
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: WAZUH_API_USER
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: WAZUH_API_PASSWORD
            # Some image tags also honor these aliases
            - name: WAZUH_API_USER
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: WAZUH_API_USER
            - name: WAZUH_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-secrets
                  key: WAZUH_API_PASSWORD
          ports:
            - containerPort: 1514
              name: agents
            - containerPort: 1515
              name: enrollment
            - containerPort: 55000
              name: api
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
spec:
  type: ClusterIP
  ports:
    - port: 1514
      targetPort: 1514
      name: agents
    - port: 1515
      targetPort: 1515
      name: enrollment
    - port: 55000
      targetPort: 55000
      name: api
  selector:
    app.kubernetes.io/name: wazuh-manager
