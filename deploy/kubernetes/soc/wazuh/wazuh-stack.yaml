apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-indexer
  labels:
    app.kubernetes.io/name: wazuh-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-indexer
    spec:
      containers:
        - name: wazuh-indexer
          image: opensearchproject/opensearch:2.13.0
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            # LAB ONLY — do not carry into staging/prod. Prefer security plugin +
            # credentials from sync-vault-to-k8s.sh / External Secrets later.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
              name: api
            - containerPort: 9600
              name: perf
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: api
  selector:
    app.kubernetes.io/name: wazuh-indexer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-manager
  labels:
    app.kubernetes.io/name: wazuh-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-manager
    spec:
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.8.0
          env:
            - name: INDEXER_URL
              value: http://wazuh-indexer:9200
          ports:
            - containerPort: 1514
              name: agents
            - containerPort: 1515
              name: enrollment
            - containerPort: 55000
              name: api
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
spec:
  type: ClusterIP
  ports:
    - port: 1514
      targetPort: 1514
      name: agents
    - port: 1515
      targetPort: 1515
      name: enrollment
    - port: 55000
      targetPort: 55000
      name: api
  selector:
    app.kubernetes.io/name: wazuh-manager
