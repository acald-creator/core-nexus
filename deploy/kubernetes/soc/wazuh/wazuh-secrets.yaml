# Lab defaults — overwrite with: ./deploy/scripts/sync-vault-to-k8s.sh
# Source of truth: nexus-hashistack secret/soc/wazuh
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-secrets
  namespace: soc
  labels:
    app.kubernetes.io/part-of: underground-nexus
    app.kubernetes.io/component: wazuh
type: Opaque
stringData:
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: changeme
  WAZUH_API_PASSWORD: changeme
  # Usernames are not secret; kept here so one Secret feeds all Wazuh env refs.
  INDEXER_USERNAME: admin
  WAZUH_API_USER: wazuh-wui
