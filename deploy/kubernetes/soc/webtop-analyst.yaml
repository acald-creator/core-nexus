apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop-analyst
  namespace: soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webtop-analyst
  template:
    metadata:
      labels:
        app: webtop-analyst
        zarf.dev/agent: skip
    spec:
      containers:
      - name: webtop-analyst
        image: linuxserver/webtop:amd64-ubuntu-xfce
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 3000
          name: web
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        volumeMounts:
        - name: webtop-config
          mountPath: /config
        - name: soc-shared
          mountPath: /soc-shared
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: webtop-config
        persistentVolumeClaim:
          claimName: webtop-analyst-config-pvc
      - name: soc-shared
        persistentVolumeClaim:
          claimName: soc-shared-pvc
      - name: dshm
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webtop-analyst-config-pvc
  namespace: soc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soc-shared-pvc
  namespace: soc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webtop-analyst
  namespace: soc
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: web
  selector:
    app: webtop-analyst
