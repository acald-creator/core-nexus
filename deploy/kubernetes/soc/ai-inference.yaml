apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
        zarf.dev/agent: skip
    spec:
      containers:
      - name: ai-inference
        image: local/ai-inference:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: api
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "250m"
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference
  namespace: soc
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: api
  selector:
    app: ai-inference
