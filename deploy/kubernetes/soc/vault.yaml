apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        zarf.dev/agent: skip
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.15.2
        imagePullPolicy: IfNotPresent
        command: ["vault", "server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "myroot"
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        ports:
        - containerPort: 8200
          name: api
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: soc
spec:
  ports:
  - port: 8200
    targetPort: 8200
    name: api
  selector:
    app: vault
