apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Replace in-cluster MinIO with the Helm chart below.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: minio
    target:
      kind: StatefulSet
      name: minio
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: minio
    target:
      kind: Service
      name: minio

helmGlobals:
  chartHome: /tmp/charts

helmCharts:
  # Vault is not deployed from this repo — use nexus-hashistack or shared Vault.
  - name: minio
    repo: https://charts.bitnami.com/bitnami
    version: 14.6.0
    releaseName: minio
    namespace: soc
    valuesFile: minio-values.yaml
