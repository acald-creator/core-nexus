# Non-lab object store: Cloudflare R2 for gateway blobs.
# Lab MinIO remains on overlays/dev, overlays/gitops-lab, and compose.
#
# Secrets: NEXUS_VAULT_GW_PATH=nexus/prod ./deploy/scripts/sync-vault-to-k8s.sh
# (Secret is excluded from this kustomization so Argo cannot clobber it.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: soc
resources:
  - ../../console
  - object-store-config.yaml
patches:
  - path: gateway-object-store-patch.yaml
  - path: delete-lab-gateway-secrets.yaml
replacements:
  - source:
      kind: ConfigMap
      name: nexus-object-store
      fieldPath: data.R2_ACCOUNT_ID
    targets:
      - select:
          kind: Deployment
          name: nexus-api-gateway
        fieldPaths:
          - 'spec.template.spec.containers.[name=api-gateway].env.[name=NEXUS_GW_R2_ACCOUNT_ID].value'
  - source:
      kind: ConfigMap
      name: nexus-object-store
      fieldPath: data.BUCKET
    targets:
      - select:
          kind: Deployment
          name: nexus-api-gateway
        fieldPaths:
          - 'spec.template.spec.containers.[name=api-gateway].env.[name=NEXUS_GW_MINIO_BUCKET].value'
  - source:
      kind: ConfigMap
      name: nexus-object-store
      fieldPath: data.PUBLIC_ENDPOINT
    targets:
      - select:
          kind: Deployment
          name: nexus-api-gateway
        fieldPaths:
          - 'spec.template.spec.containers.[name=api-gateway].env.[name=NEXUS_GW_MINIO_PUBLIC_ENDPOINT].value'
  - source:
      kind: ConfigMap
      name: nexus-object-store
      fieldPath: data.D1_PROXY_URL
    targets:
      - select:
          kind: Deployment
          name: nexus-api-gateway
        fieldPaths:
          - 'spec.template.spec.containers.[name=api-gateway].env.[name=NEXUS_GW_D1_PROXY_URL].value'
images:
  - name: phoenixvlabs/nexus-console
    newName: phoenixvlabs/nexus-console
    newTag: v0.2.2 # {"$imagepolicy": "flux-system:nexus-console:tag"}
  - name: phoenixvlabs/nexus-api-gateway
    newName: phoenixvlabs/nexus-api-gateway
    newTag: v0.2.3 # {"$imagepolicy": "flux-system:nexus-api-gateway:tag"}
