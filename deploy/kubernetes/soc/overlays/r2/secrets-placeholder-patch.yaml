# Force operators to replace lab MinIO keys before talking to R2.
# Prefer: NEXUS_VAULT_GW_PATH=nexus/prod ./deploy/scripts/sync-vault-to-k8s.sh
apiVersion: v1
kind: Secret
metadata:
  name: nexus-gateway-secrets
  namespace: soc
type: Opaque
stringData:
  NEXUS_GW_JWT_SECRET: REPLACE_ME_JWT_SECRET
  NEXUS_GW_MINIO_ACCESS_KEY: REPLACE_ME_R2_ACCESS_KEY_ID
  NEXUS_GW_MINIO_SECRET_KEY: REPLACE_ME_R2_SECRET_ACCESS_KEY
  NEXUS_GW_WAZUH_API_PASSWORD: REPLACE_ME_OR_SYNC_FROM_VAULT
  NEXUS_GW_VAULT_ROLE_ID: ""
  NEXUS_GW_VAULT_SECRET_ID: ""
