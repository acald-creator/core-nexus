# Test overlay keeps a dedicated PVC/ConfigMap name; align mounts with base file backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: soc
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 100
      containers:
      - name: vault
        image: hashicorp/vault:1.18.5
        command: ["vault", "server", "-config=/vault/config/vault.hcl"]
        env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        volumeMounts:
        - name: config-volume
          mountPath: /vault/config
        - name: data-volume
          mountPath: /vault/file
      volumes:
      - name: config-volume
        configMap:
          name: vault-test-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: vault-test-data-pvc
