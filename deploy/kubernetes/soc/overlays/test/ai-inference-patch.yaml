apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: soc
spec:
  template:
    spec:
      containers:
      - name: ai-inference
        volumeMounts:
        - name: script-volume
          mountPath: /app/main.py
          subPath: main.py
      volumes:
      - name: script-volume
        configMap:
          name: ai-inference-script
