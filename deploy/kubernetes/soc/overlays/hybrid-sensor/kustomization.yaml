# Compose-your-own SOC: Suricata + Zeek + Falco + Tetragon → Vector → ai-inference.
# No Wazuh. ADR 0011.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../console
  - ../../ai-inference
  - ../../../system/tetragon
  - ../../../system/falco
  - sensors
  - vector

patches:
  - path: gateway-alerts-patch.yaml

images:
  - name: phoenixvlabs/nexus-console
    newName: phoenixvlabs/nexus-console
    newTag: v0.2.5
  - name: phoenixvlabs/nexus-api-gateway
    newName: phoenixvlabs/nexus-api-gateway
    newTag: v0.2.5
  - name: phoenixvlabs/nexus-ai-inference
    newName: phoenixvlabs/nexus-ai-inference
    newTag: v0.2.5
