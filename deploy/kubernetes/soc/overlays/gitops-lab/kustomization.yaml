# Thin GitOps lab: Console + API gateway (see ../../console).
# Flux ImageUpdateAutomation (Setters) rewrites newTag markers below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: soc
resources:
  - ../../console
images:
  - name: phoenixvlabs/nexus-console
    newName: phoenixvlabs/nexus-console
    newTag: v0.2.2 # {"$imagepolicy": "flux-system:nexus-console:tag"}
  - name: phoenixvlabs/nexus-api-gateway
    newName: phoenixvlabs/nexus-api-gateway
    newTag: v0.2.1 # {"$imagepolicy": "flux-system:nexus-api-gateway:tag"}
