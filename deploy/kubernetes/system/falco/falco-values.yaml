# Falco — runtime detection for hybrid-sensor overlay (ADR 0011).
# JSON to stdout; Vector collects via kubernetes_logs label selector.
falcosidekick:
  enabled: false

driver:
  # modern_ebpf works on Rancher Desktop / lima without kernel headers (lab default).
  kind: modern_ebpf

falco:
  json_output: true
  json_include_output_property: true
  log_stderr: true
  log_syslog: false

podLabels:
  nexus.nebucloud.io/sensor: runtime
