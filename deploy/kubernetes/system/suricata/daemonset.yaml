apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  labels:
    app.kubernetes.io/name: suricata
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: suricata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suricata
    spec:
      hostNetwork: true
      containers:
        - name: suricata
          image: docker.io/jasonish/suricata:7.0
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_NICE
          command:
            - /bin/sh
            - -c
            - |
              sh /etc/suricata/scripts/update-rules.sh
              # Capture every lab-relevant iface that exists on this node.
              # Rancher Desktop: eth0 (VM) + vznat (pod↔host) + cni0 (pod CNI).
              IFACES=""
              for i in eth0 vznat cni0; do
                if ip link show "$i" >/dev/null 2>&1; then
                  IFACES="$IFACES -i $i"
                  echo "suricata: capturing $i"
                fi
              done
              if [ -z "$IFACES" ]; then
                echo "suricata: no interfaces found; falling back to eth0"
                IFACES="-i eth0"
              fi
              # shellcheck disable=SC2086
              suricata -c /etc/suricata/suricata.yaml $IFACES
          volumeMounts:
            - name: config-volume
              mountPath: /etc/suricata/suricata.yaml
              subPath: suricata.yaml
            - name: config-volume
              mountPath: /etc/suricata/scripts/update-rules.sh
              subPath: update-rules.sh
            - name: config-volume
              mountPath: /etc/suricata/athena.rules
              subPath: athena.rules
            - name: log-volume
              mountPath: /var/log/suricata
        - name: log-tail
          image: docker.io/busybox:1.36
          command: ["/bin/sh", "-c", "touch /var/log/suricata/eve.json && tail -F /var/log/suricata/eve.json"]
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/suricata
      volumes:
        - name: config-volume
          configMap:
            name: suricata-config
            defaultMode: 0755
        - name: log-volume
          emptyDir: {}
