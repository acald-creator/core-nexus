apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  labels:
    app.kubernetes.io/name: suricata
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: suricata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suricata
    spec:
      hostNetwork: true
      containers:
        - name: suricata
          image: jasonish/suricata:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_NICE
          command:
            - /bin/sh
            - -c
            - |
              sh /etc/suricata/scripts/update-rules.sh
              suricata -c /etc/suricata/suricata.yaml -i eth0
          volumeMounts:
            - name: config-volume
              mountPath: /etc/suricata/suricata.yaml
              subPath: suricata.yaml
            - name: config-volume
              mountPath: /etc/suricata/scripts/update-rules.sh
              subPath: update-rules.sh
            - name: log-volume
              mountPath: /var/log/suricata
        - name: log-tail
          image: busybox
          command: ["/bin/sh", "-c", "touch /var/log/suricata/eve.json && tail -F /var/log/suricata/eve.json"]
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/suricata
      volumes:
        - name: config-volume
          configMap:
            name: suricata-config
            defaultMode: 0755
        - name: log-volume
          emptyDir: {}
