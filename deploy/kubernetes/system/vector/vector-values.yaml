role: "Agent"

customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: true
    address: 127.0.0.1:8686

  sources:
    kubernetes_logs:
      type: kubernetes_logs
      extra_label_selector: "app.kubernetes.io/name in (tetragon,suricata)"

  transforms:
    parse_tetragon:
      type: remap
      inputs:
        - kubernetes_logs
      source: |
        if is_string(.message) && starts_with(.message, "{") {
          .message = parse_json(.message) ?? .message
        }

  sinks:
    ai_inference:
      type: http
      inputs:
        - parse_tetragon
      uri: "http://ai-inference.soc.svc.cluster.local:8000/v1/triage"
      method: "post"
      encoding:
        codec: "json"
      batch:
        max_events: 10
    wazuh_indexer:
      type: elasticsearch
      inputs:
        - parse_tetragon
      endpoints:
        - "http://wazuh-indexer.soc.svc.cluster.local:9200"
      mode: "bulk"
      index: "soc-events-%Y.%m.%d"
